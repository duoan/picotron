<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2f7da6"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#3a9d5d"/></marker>
  </defs>

  <text x="20" y="28" font-size="18" fill="#28323b" font-weight="bold">ZB-V placement: G = 2p chunks in a V, 2 per device (p = 4)</text>

  <!-- device row guides -->
  <g font-size="12" fill="#8a97a0">
    <line x1="95" y1="90"  x2="800" y2="90"  stroke="#eef1f3"/>
    <line x1="95" y1="170" x2="800" y2="170" stroke="#eef1f3"/>
    <line x1="95" y1="250" x2="800" y2="250" stroke="#eef1f3"/>
    <line x1="95" y1="330" x2="800" y2="330" stroke="#eef1f3"/>
    <text x="20" y="94">device 0</text>
    <text x="20" y="174">device 1</text>
    <text x="20" y="254">device 2</text>
    <text x="20" y="334">device 3</text>
  </g>

  <!-- forward arrows along the V (chunk g -> g+1) -->
  <g stroke="#2f7da6" stroke-width="2" fill="none" marker-end="url(#af)">
    <line x1="147" y1="90"  x2="183" y2="170"/>
    <line x1="237" y1="170" x2="273" y2="250"/>
    <line x1="327" y1="250" x2="363" y2="330"/>
    <line x1="417" y1="330" x2="453" y2="330"/>
    <line x1="507" y1="330" x2="543" y2="250"/>
    <line x1="597" y1="250" x2="633" y2="170"/>
    <line x1="687" y1="170" x2="723" y2="90"/>
  </g>
  <!-- backward arrows (reverse, offset down/right, dashed) -->
  <g stroke="#3a9d5d" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ab)" opacity="0.85">
    <line x1="726" y1="103" x2="690" y2="183"/>
    <line x1="636" y1="183" x2="600" y2="263"/>
    <line x1="546" y1="263" x2="510" y2="343"/>
    <line x1="450" y1="343" x2="420" y2="343"/>
    <line x1="360" y1="343" x2="324" y2="263"/>
    <line x1="270" y1="263" x2="234" y2="183"/>
    <line x1="180" y1="183" x2="144" y2="103"/>
  </g>

  <!-- chunk nodes: down-leg (blue) g=0..3, up-leg (purple) g=4..7 -->
  <g font-size="13" text-anchor="middle">
    <rect x="93"  y="73"  width="54" height="34" rx="5" fill="#d6ebf4" stroke="#caa63a" stroke-width="2.5"/><text x="120" y="95" fill="#1c3f52">c0</text>
    <rect x="183" y="153" width="54" height="34" rx="5" fill="#d6ebf4" stroke="#2f7da6"/><text x="210" y="175" fill="#1c3f52">c1</text>
    <rect x="273" y="233" width="54" height="34" rx="5" fill="#d6ebf4" stroke="#2f7da6"/><text x="300" y="255" fill="#1c3f52">c2</text>
    <rect x="363" y="313" width="54" height="34" rx="5" fill="#d6ebf4" stroke="#2f7da6"/><text x="390" y="335" fill="#1c3f52">c3</text>
    <rect x="453" y="313" width="54" height="34" rx="5" fill="#e8dff5" stroke="#7d5ba6"/><text x="480" y="335" fill="#3d2a63">c4</text>
    <rect x="543" y="233" width="54" height="34" rx="5" fill="#e8dff5" stroke="#7d5ba6"/><text x="570" y="255" fill="#3d2a63">c5</text>
    <rect x="633" y="153" width="54" height="34" rx="5" fill="#e8dff5" stroke="#7d5ba6"/><text x="660" y="175" fill="#3d2a63">c6</text>
    <rect x="723" y="73"  width="54" height="34" rx="5" fill="#e8dff5" stroke="#caa63a" stroke-width="2.5"/><text x="750" y="95" fill="#3d2a63">c7</text>
  </g>

  <!-- annotations -->
  <text x="120" y="62" font-size="11" fill="#caa63a" font-weight="bold" text-anchor="middle">input &#8594; embed</text>
  <text x="750" y="62" font-size="11" fill="#caa63a" font-weight="bold" text-anchor="middle">loss (final)</text>
  <text x="435" y="368" font-size="11" fill="#7d5ba6" text-anchor="middle">local turn c3&#8594;c4 (same device, no network hop)</text>

  <text x="150" y="245" font-size="12" fill="#2f7da6" font-weight="bold">down-leg (device index &#8593;)</text>
  <text x="600" y="128" font-size="12" fill="#7d5ba6" font-weight="bold">up-leg (device index &#8595;)</text>

  <text x="20" y="398" font-size="13" fill="#28323b">device <tspan font-weight="bold">d</tspan> holds chunk <tspan font-weight="bold">d</tspan> (down) + chunk <tspan font-weight="bold">2p-1-d</tspan> (up). First &amp; last chunk both on device 0 &#8594; loss returns home.</text>
  <text x="20" y="416" font-size="12" fill="#8a97a0">Solid = forward activations; dashed = backward grads. Each backward is split B (input-grad) + W (weight-grad); W fills the bubbles &#8594; &#8776; zero bubble at ~1F1B memory.</text>
</svg>
