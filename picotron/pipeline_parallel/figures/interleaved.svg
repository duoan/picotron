<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Helvetica, Arial, sans-serif">
  <text x="20" y="34" font-size="18" fill="#28323b" font-weight="bold">Interleaved 1F1B (virtual pipeline): v chunks per rank, round-robin</text>

  <text x="20" y="66" font-size="14" fill="#28323b">8 layers, p = 4 ranks, v = 2 virtual stages -> G = p*v = 8 virtual stages laid out round-robin:</text>

  <!-- 8 layer blocks colored by owning rank -->
  <g font-size="12">
    <!-- virtual stage g lives on rank g % p, chunk g // p -->
    <!-- rank colors -->
    <!-- g0 r0c0 -->
    <rect x="60"  y="92" width="100" height="44" rx="5" fill="#d6ebf4" stroke="#2f7da6" stroke-width="2"/>
    <text x="110" y="112" text-anchor="middle" fill="#1c3f52" font-weight="bold">layer 0</text>
    <text x="110" y="128" text-anchor="middle" fill="#8a97a0">vstage0 | r0</text>
    <!-- g1 r1c0 -->
    <rect x="170" y="92" width="100" height="44" rx="5" fill="#e7dcf3" stroke="#7a52a6" stroke-width="2"/>
    <text x="220" y="112" text-anchor="middle" fill="#3d2a55" font-weight="bold">layer 1</text>
    <text x="220" y="128" text-anchor="middle" fill="#8a97a0">vstage1 | r1</text>
    <!-- g2 r2c0 -->
    <rect x="280" y="92" width="100" height="44" rx="5" fill="#d6f0e0" stroke="#3a9d5d" stroke-width="2"/>
    <text x="330" y="112" text-anchor="middle" fill="#1f4a33" font-weight="bold">layer 2</text>
    <text x="330" y="128" text-anchor="middle" fill="#8a97a0">vstage2 | r2</text>
    <!-- g3 r3c0 -->
    <rect x="390" y="92" width="100" height="44" rx="5" fill="#f6e1d2" stroke="#c8682f" stroke-width="2"/>
    <text x="440" y="112" text-anchor="middle" fill="#7a3d12" font-weight="bold">layer 3</text>
    <text x="440" y="128" text-anchor="middle" fill="#8a97a0">vstage3 | r3</text>
    <!-- g4 r0c1 -->
    <rect x="500" y="92" width="100" height="44" rx="5" fill="#bfe0ee" stroke="#2f7da6" stroke-width="2"/>
    <text x="550" y="112" text-anchor="middle" fill="#1c3f52" font-weight="bold">layer 4</text>
    <text x="550" y="128" text-anchor="middle" fill="#8a97a0">vstage4 | r0</text>
    <!-- g5 r1c1 -->
    <rect x="610" y="92" width="100" height="44" rx="5" fill="#d8c7ec" stroke="#7a52a6" stroke-width="2"/>
    <text x="660" y="112" text-anchor="middle" fill="#3d2a55" font-weight="bold">layer 5</text>
    <text x="660" y="128" text-anchor="middle" fill="#8a97a0">vstage5 | r1</text>
    <!-- g6 r2c1 -->
    <rect x="720" y="92" width="100" height="44" rx="5" fill="#c2e6cf" stroke="#3a9d5d" stroke-width="2"/>
    <text x="770" y="112" text-anchor="middle" fill="#1f4a33" font-weight="bold">layer 6</text>
    <text x="770" y="128" text-anchor="middle" fill="#8a97a0">vstage6 | r2</text>
    <!-- g7 r3c1 -->
    <rect x="830" y="92" width="100" height="44" rx="5" fill="#f3d2bc" stroke="#c8682f" stroke-width="2"/>
    <text x="880" y="112" text-anchor="middle" fill="#7a3d12" font-weight="bold">layer 7</text>
    <text x="880" y="128" text-anchor="middle" fill="#8a97a0">vstage7 | r3</text>
  </g>

  <!-- activation flow arrow -->
  <line x1="60" y1="156" x2="930" y2="156" stroke="#cdd5da" stroke-width="1"/>
  <text x="495" y="174" text-anchor="middle" font-size="12" fill="#8a97a0">activations flow vstage 0 -> 1 -> & -> 7  (ranks visited 0->1->2->3->0->1->2->3)</text>

  <!-- rank ownership recap -->
  <text x="20" y="214" font-size="14" fill="#28323b" font-weight="bold">Each rank owns 2 non-contiguous chunks:</text>
  <text x="40" y="240" font-size="13" fill="#2f7da6">rank 0 -> layers {0, 4}</text>
  <text x="240" y="240" font-size="13" fill="#7a52a6">rank 1 -> layers {1, 5}</text>
  <text x="440" y="240" font-size="13" fill="#3a9d5d">rank 2 -> layers {2, 6}</text>
  <text x="640" y="240" font-size="13" fill="#c8682f">rank 3 -> layers {3, 7}</text>

  <text x="20" y="296" font-size="16" fill="#28323b">Each virtual stage is vx smaller, so the bubble shrinks by v:</text>
  <text x="40" y="330" font-size="22" fill="#2f7da6" font-weight="bold">bubble = (p - 1) / (m | v)</text>
  <text x="380" y="330" font-size="14" fill="#8a97a0">cost: vx more cross-rank activation hops (more comm). Needs m % p == 0.</text>
</svg>
