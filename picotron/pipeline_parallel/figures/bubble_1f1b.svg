<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Helvetica, Arial, sans-serif">
  <text x="20" y="34" font-size="18" fill="#28323b" font-weight="bold">1F1B: the pipeline bubble is the staggered fill &amp; drain</text>

  <!-- stage labels -->
  <text x="20" y="78" font-size="13" fill="#8a97a0">stage 0</text>
  <text x="20" y="118" font-size="13" fill="#8a97a0">stage 1</text>
  <text x="20" y="158" font-size="13" fill="#8a97a0">stage 2</text>
  <text x="20" y="198" font-size="13" fill="#8a97a0">stage 3</text>

  <!-- warmup bubble triangle (idle as the pipeline fills) -->
  <polygon points="90,205 90,65 230,205" fill="#f6e1d2" stroke="#c8682f" stroke-width="1.5"/>
  <text x="120" y="190" font-size="13" fill="#c8682f">bubble</text>
  <text x="108" y="206" font-size="11" fill="#c8682f">(warmup)</text>

  <!-- steady-state parallelogram: F/B interleaved, all stages busy -->
  <polygon points="90,65 730,65 870,205 230,205" fill="#d6ebf4" stroke="#2f7da6" stroke-width="1.5" opacity="0.55"/>
  <text x="460" y="140" text-anchor="middle" font-size="15" fill="#2f7da6" font-weight="bold">steady state: 1 forward + 1 backward / step</text>

  <!-- cooldown bubble triangle -->
  <polygon points="730,65 870,205 870,65" fill="#f6e1d2" stroke="#c8682f" stroke-width="1.5"/>
  <text x="792" y="92" font-size="13" fill="#c8682f">bubble</text>
  <text x="780" y="108" font-size="11" fill="#c8682f">(drain)</text>

  <!-- sample forward cells on the leading diagonal -->
  <g font-size="11" fill="#1c3f52">
    <rect x="92"  y="66"  width="30" height="26" rx="3" fill="#bfe0ee" stroke="#2f7da6"/><text x="100" y="83">F</text>
    <rect x="132" y="106" width="30" height="26" rx="3" fill="#bfe0ee" stroke="#2f7da6"/><text x="140" y="123">F</text>
    <rect x="172" y="146" width="30" height="26" rx="3" fill="#bfe0ee" stroke="#2f7da6"/><text x="180" y="163">F</text>
    <rect x="212" y="186" width="30" height="26" rx="3" fill="#bfe0ee" stroke="#2f7da6"/><text x="220" y="203">F</text>
  </g>
  <!-- sample backward cells on the trailing diagonal -->
  <g font-size="11" fill="#1f4a33">
    <rect x="718" y="66"  width="30" height="26" rx="3" fill="#cfe9d6" stroke="#3a9d5d"/><text x="726" y="83">B</text>
    <rect x="758" y="106" width="30" height="26" rx="3" fill="#cfe9d6" stroke="#3a9d5d"/><text x="766" y="123">B</text>
    <rect x="798" y="146" width="30" height="26" rx="3" fill="#cfe9d6" stroke="#3a9d5d"/><text x="806" y="163">B</text>
    <rect x="838" y="186" width="30" height="26" rx="3" fill="#cfe9d6" stroke="#3a9d5d"/><text x="846" y="203">B</text>
  </g>

  <!-- time axis -->
  <line x1="90" y1="232" x2="870" y2="232" stroke="#28323b" stroke-width="1.5"/>
  <path d="M870,232 l-8,-4 l0,8 z" fill="#28323b"/>
  <text x="480" y="250" text-anchor="middle" font-size="12" fill="#8a97a0">time</text>

  <!-- bubble fraction callout -->
  <text x="20" y="300" font-size="16" fill="#28323b">Bubble fraction (fraction of time a device is idle):</text>
  <text x="40" y="332" font-size="22" fill="#c8682f" font-weight="bold">bubble = (p - 1) / m</text>
  <text x="360" y="332" font-size="14" fill="#8a97a0">p = #stages, m = #micro-batches. More micro-batches -> thinner triangles.</text>
</svg>
