<h1 id="pipeline-parallelism-from-scratch">Pipeline Parallelism, from scratch</h1>
<h2 id="how-picotrons-pipeline_parallel-works--then-the-last-two-years-of-pp-research">How <code>picotron</code>'s pipeline_parallel works — then the last two years of PP research</h2>

<h2 id="why-pipeline-parallelism">Why pipeline parallelism?</h2>
<p>A large model's parameters + activations + optimizer state don't fit on one device. picotron already<br />
shards along <strong>data (DP)</strong>, <strong>tensor (TP)</strong>, <strong>context (CP)</strong> and <strong>expert (EP)</strong> axes. <strong>Pipeline<br />
parallelism (PP)</strong> adds another: split the model <strong>by depth</strong> — give each device a contiguous block of<br />
layers (a <em>stage</em>).</p>
<ul>
<li><strong>TP</strong> splits <em>within</em> a layer → needs a fast all-reduce every layer (intra-node, NVLink).</li>
<li><strong>PP</strong> splits <em>across</em> layers → a device only sends its output activations to the <strong>next</strong> stage.</li>
<li>That is a single point-to-point hop per stage boundary → cheap, and scales across nodes.</li>
</ul>
<p><span class="muted">PP is how you train a model deeper than one node's memory with only neighbor-to-neighbor traffic.</span></p>
</section>

<h2 id="micro-batching--pipelining-gpipe--afab">Micro-batching = pipelining (GPipe / AFAB)</h2>
<p>Split the global batch into <code>m</code> <strong>micro-batches</strong> and feed them back-to-back. Now while stage 0 starts<br />
micro-batch 1, stage 1 works on micro-batch 0 — the stages <strong>overlap</strong>.</p>

<p><strong>AFAB</strong> (all-forward-all-backward) = picotron's <code>train_step_pipeline_afab</code>: push all <code>m</code> forwards,<br />
then all <code>m</code> backwards. Simple — but it keeps <strong>every</strong> micro-batch's activations alive until backward,<br />
so activation memory grows with <code>m</code>.</p>

<h2 id="the-bubble-quantified">The bubble, quantified</h2>

<h2 id="1f1b-same-bubble-bounded-memory">1F1B: same bubble, bounded memory</h2>
<p>Reorder so each stage, after a short warmup, does <strong>one forward then one backward</strong> in lockstep. Each<br />
backward frees the activations of the oldest in-flight micro-batch, so a stage holds only <code>~p</code><br />
micro-batches' activations (not <code>m</code>).</p>

<p>Same <code>(p-1)/m</code> bubble as AFAB, but activation memory is capped by pipeline <strong>depth</strong>, not <code>m</code><br />
(e.g. <code>m=100</code>: AFAB holds ~100× activations, 1F1B only ~<code>p</code>). This is picotron's default<br />
(<code>train_step_pipeline_1f1b</code>) and the foundation everything below builds on.</p>

<h2 id="picotrons-two-built-in-schedules--and-our-goal">picotron's two built-in schedules — and our goal</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># pipeline_parallel.py</span>
train_step_pipeline_afab   <span class="hljs-comment"># all forwards, then all backwards — biggest memory + bubble</span>
train_step_pipeline_1f1b   <span class="hljs-comment"># 1 fwd / 1 bwd steady state — bubble (p-1)/m, bounded memory</span>
</code></pre>
<p>Each rank holds a <code>PipelineParallel</code> stage: <code>embedding</code> (first), some <code>decoder_layers</code>,<br />
<code>final_norm</code> + <code>final_proj</code> (last). Communication is point-to-point on a ring.</p>
<p><strong>Goal:</strong> shrink the <code>(p-1)/m</code> bubble. Three levers, three trade-offs:</p>
<table>
<thead>
<tr>
<th>schedule</th>
<th>idea</th>
<th>trades</th>
</tr>
</thead>
<tbody>
<tr>
<td>Zero-Bubble</td>
<td>split backward into B + W</td>
<td>W-queue activation memory (~1× FLOPs)</td>
</tr>
<tr>
<td>Interleaved 1F1B</td>
<td><code>v</code> virtual stages per rank</td>
<td><code>v</code>× more comm</td>
</tr>
<tr>
<td>DualPipe</td>
<td>two opposing streams</td>
<td>~2× parameter memory</td>
</tr>
</tbody>
</table>
</section>

<h2 id="lever-1--zero-bubble-zb-h1">Lever 1 — Zero-Bubble (ZB-H1)</h2>
<p><span class="muted">Qi et al., ICLR 2024 — arXiv:2401.10241</span></p>
<p>A backward fuses <strong>B</strong> (grad w.r.t. <em>input</em> — the previous stage needs it, so it's on the critical<br />

<h2 id="zb-how-we-split-the-backward-true-1%C3%97-flops">ZB: how we split the backward (true ~1× FLOPs)</h2>
<p>We split at the <strong>Linear</strong> level, so each matmul runs <strong>once</strong> — not a 2× double-traversal. A custom<br />
autograd function (<code>_DeferredLinear</code>) returns the input-grad now and <strong>defers</strong> the weight-grad:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">_DeferredLinear</span>(torch.autograd.Function):
<span class="hljs-meta">    @staticmethod</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">backward</span>(<span class="hljs-params">ctx, grad_y</span>):
        x, weight = ctx.saved_tensors
        grad_x = grad_y.matmul(weight)              <span class="hljs-comment"># B: needed upstream now (critical path)</span>
        <span class="hljs-keyword">def</span> <span class="hljs-title function_">_accumulate_weight_grad</span>():              <span class="hljs-comment"># W: queued, drained into the bubble later</span>
            gw = grad_y.reshape(-<span class="hljs-number">1</span>, D).t().matmul(x.reshape(-<span class="hljs-number">1</span>, D))
            weight.grad = gw <span class="hljs-keyword">if</span> weight.grad <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">else</span> weight.grad + gw
        _W_TASKS.append(_accumulate_weight_grad)
        <span class="hljs-keyword">return</span> grad_x, <span class="hljs-literal">None</span>                         <span class="hljs-comment"># weight-grad = None for now</span>
</code></pre>
<p><code>backward_input</code> runs autograd → collects only <code>grad_x</code> (+ a FIFO of deferred W-tasks per micro-batch);<br />
<code>backward_weight</code> drains that FIFO. The <strong>B</strong> comm pattern is identical to 1F1B → deadlock-free, and<br />
gradients are <strong>bit-exact</strong> (<code>grad_diff = 0</code>). Cost: the W queue holds <code>(x, grad_y)</code> per in-flight<br />
micro-batch → extra activation memory (peak grows with <code>num_warmup</code>, like ZB-H1 in the paper).</p>
</section>

<h2 id="interleaved-the-wrapper--the-schedule">Interleaved: the wrapper + the schedule</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">InterleavedPipelineParallel</span>(nn.Module):
    <span class="hljs-comment"># virtual stage g lives on rank g % p, chunk g // p</span>
    <span class="hljs-variable language_">self</span>.chunk_global_id = [c * p + rank <span class="hljs-keyword">for</span> c <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(num_virtual_stages)]
    <span class="hljs-comment"># embeddings / decoder_chunks / final_norms / final_projs are ModuleLists, one per chunk</span>
</code></pre>
<ul>
<li>Per-chunk FIFOs of inputs/outputs/grads; <code>fwd_chunk(step)</code> / <code>bwd_chunk(step)</code> pick the active chunk.</li>
<li>One <strong>combined</strong> ring send/recv per step (<code>interleaved_pipeline_communicate</code>): post all sends, drain<br />
receives first, then sends — the deadlock-free pattern for synchronous ring P2P.</li>
<li>Requires <code>m % p == 0</code>.</li>
</ul>
<p><strong>Bubble:</strong> <code>(p-1)/(m·v)</code>  ·  <strong>cost:</strong> <code>v</code>× more cross-rank activation hops.</p>

<h2 id="dualpipe-two-streams-overlapped-in-time-what-we-built">DualPipe: two streams overlapped in time (what we built)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Each stream is a generator yielding its batched P2P at every comm point:</span>
down = _dualpipe_stream(model, batches[:m//<span class="hljs-number">2</span>], group=grp_down, ...)  <span class="hljs-comment"># stage 0→p-1</span>
up   = _dualpipe_stream(model, batches[m//<span class="hljs-number">2</span>:], group=grp_up,   ...)  <span class="hljs-comment"># stage p-1→0 (mirror)</span>
_drive_dualpipe(down, up)      <span class="hljs-comment"># interleave the two on independent communicators</span>
dualpipe_reduce_grads(model)   <span class="hljs-comment"># sum each replicated stage&#x27;s grads across (r, p-1-r)</span>
</code></pre>
<ul>
<li><strong>Structure</strong> (replicated stages + cross-pair grad sum) reproduces a full <code>m</code>-micro-batch gradient<br />
<strong>bit-exactly</strong> — on gloo <strong>and</strong> NCCL.</li>
<li><strong>Time-domain overlap is real:</strong> one stream's forwards fill the other's backward bubbles<br />
(bubble <code>≈ (p-1)/(2m)</code>). NCCL → single-thread completion-polling driver (<code>is_completed()</code>), comm of one<br />
direction overlaps compute of the other on its own CUDA stream; gloo → thread-per-stream on separate<br />
communicators. Independent PP subgroups keep the two streams' P2P from aliasing.</li>
<li><strong>Bit-exact + deadlock-free on NCCL at <code>p=2/4/8</code></strong> (eager P2P-connection warmup + per-stream CUDA<br />
streams break the lazy-handshake / CUDA-stream-ordering deadlocks).</li>
<li><strong>Caveat:</strong> each rank holds <strong>two</strong> stages (<code>r</code> and <code>p-1-r</code>) → ~2× layer compute. On 8×L4 (<code>p=8, m=16</code>) it is 0.78× of 1F1B: overlap recovers most of the 2× (it is 1.28×, not 2×) but not all. It pays<br />
off only where removed bubble &gt; 2× replication tax — very large <code>p</code>/small <code>m</code>, or with DeepSeek's<br />
intra-chunk SM-level kernel overlap (the remaining custom-CUDA piece).</li>
</ul>
</section>

<h2 id="why-batched-p2p-is-mandatory">Why batched P2P is mandatory</h2>
<p>Synchronous ring P2P deadlocks if every rank blocks on a send whose matching receive sits behind the<br />
partner's own send. The fix used by every schedule here: fuse all of a step's sends+recvs into <strong>one</strong><br />
<code>batch_isend_irecv</code> group, which NCCL schedules together (and gloo posts non-blocking):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">ops = []
<span class="hljs-keyword">if</span> send_t <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>: ops.append(dist.P2POp(dist.isend, send_t, next_rank))
<span class="hljs-keyword">if</span> recv_buf <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>: ops.append(dist.P2POp(dist.irecv, recv_buf, prev_rank))
<span class="hljs-keyword">for</span> req <span class="hljs-keyword">in</span> dist.batch_isend_irecv(ops):   <span class="hljs-comment"># one matched group → deadlock-free</span>
    req.wait()
</code></pre>
<p>Every <code>send</code> is count-matched by exactly one <code>recv</code> in the schedule → no phantom op, no hang. (Posting<br />
unbatched <code>isend</code>/<code>irecv</code> made NCCL serialize them as collectives and hang at <code>p ≥ 8</code> — hence the batch.)</p>
</section>

torchrun --nproc_per_node 4 tests/test_pipeline_parallel.py   # p=4

<p>ZB / interleaved are <strong>exactly</strong> the reference; DualPipe matches to float-accumulation order.</p>

<h2 id="recap--three-trade-offs-against-p-1m">Recap — three trade-offs against <code>(p-1)/m</code></h2>
<div class="cols"><div>
<p><strong>Zero-Bubble (ZB-H1)</strong></p>
<ul>
<li>split backward → B (critical) + W (fill)</li>
<li>bubble <code>≈ 0</code>, comm unchanged, ~1× FLOPs</li>
<li>cost: W-queue activation memory</li>
</ul>
<p><strong>Interleaved 1F1B</strong></p>
<ul>
<li><code>v</code> virtual stages / rank</li>
<li>bubble <code>(p-1)/(m·v)</code></li>
<li>cost: <code>v</code>× comm, needs <code>m % p == 0</code></li>
</ul>
</div><div>
<p><strong>DualPipe</strong></p>
<ul>
<li>two opposing streams, replicated stages</li>
<li>bubble <code>(p-1)/(2m)</code> (overlapped)</li>
<li>cost: ~2× param memory</li>
</ul>
<p><strong>All three</strong></p>
<ul>
<li>built on picotron's 1F1B engine</li>
<li>deadlock-free ring P2P</li>
<li>bit-exact vs full-model reference</li>
</ul>
</div></div>
<p><span class="muted">Wired into <code>create_config.py --pp_engine</code> / <code>train.py</code>: ZB is a drop-in; interleaved/dualpipe run on the test+bench harness (gloo/CPU + NCCL/GPU).</span></p>
</section>
