<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Helvetica, Arial, sans-serif">
  <text x="20" y="30" font-size="18" fill="#28323b" font-weight="bold">Tensor parallelism: column then row split inside the attention / MLP block</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2f7da6"/></marker>
  </defs>

  <rect x="30" y="150" width="120" height="56" rx="8" fill="#eef3f7" stroke="#8a97a0" stroke-width="2"/>
  <text x="90" y="175" text-anchor="middle" font-size="13" fill="#28323b">input X</text>
  <text x="90" y="194" text-anchor="middle" font-size="11" fill="#8a97a0">replicated</text>

  <circle cx="200" cy="178" r="22" fill="#fff3d6" stroke="#c79a2b" stroke-width="2"/>
  <text x="200" y="183" text-anchor="middle" font-size="16" fill="#9c7a1f" font-weight="bold">f</text>
  <text x="200" y="232" text-anchor="middle" font-size="11" fill="#9c7a1f">copy fwd /</text>
  <text x="200" y="246" text-anchor="middle" font-size="11" fill="#9c7a1f">all-reduce bwd</text>

  <rect x="260" y="96" width="220" height="74" rx="8" fill="#f4f8fb" stroke="#2f7da6" stroke-width="2"/>
  <text x="370" y="120" text-anchor="middle" font-size="13" fill="#2f7da6" font-weight="bold">ColumnParallel (q/k/v, up/gate)</text>
  <rect x="280" y="132" width="80" height="26" rx="4" fill="#d6ebf4" stroke="#2f7da6"/><text x="320" y="150" text-anchor="middle" font-size="11" fill="#1c3f52">W col0 r0</text>
  <rect x="380" y="132" width="80" height="26" rx="4" fill="#d6ebf4" stroke="#2f7da6"/><text x="420" y="150" text-anchor="middle" font-size="11" fill="#1c3f52">W col1 r1</text>
  <text x="370" y="190" text-anchor="middle" font-size="11" fill="#8a97a0">output sharded by columns (heads)</text>

  <rect x="510" y="150" width="100" height="56" rx="8" fill="#f3eefb" stroke="#7d5bbe" stroke-width="2"/>
  <text x="560" y="174" text-anchor="middle" font-size="12" fill="#5a3f93" font-weight="bold">attn / act</text>
  <text x="560" y="192" text-anchor="middle" font-size="11" fill="#8a97a0">on shards</text>

  <rect x="640" y="96" width="200" height="74" rx="8" fill="#f4f8fb" stroke="#2f7da6" stroke-width="2"/>
  <text x="740" y="120" text-anchor="middle" font-size="13" fill="#2f7da6" font-weight="bold">RowParallel (out/down)</text>
  <rect x="660" y="132" width="80" height="26" rx="4" fill="#d6ebf4" stroke="#2f7da6"/><text x="700" y="150" text-anchor="middle" font-size="11" fill="#1c3f52">W row0 r0</text>
  <rect x="750" y="132" width="80" height="26" rx="4" fill="#d6ebf4" stroke="#2f7da6"/><text x="790" y="150" text-anchor="middle" font-size="11" fill="#1c3f52">W row1 r1</text>
  <text x="740" y="190" text-anchor="middle" font-size="11" fill="#8a97a0">partial sums</text>

  <circle cx="888" cy="178" r="22" fill="#fff3d6" stroke="#c79a2b" stroke-width="2"/>
  <text x="888" y="183" text-anchor="middle" font-size="16" fill="#9c7a1f" font-weight="bold">g</text>
  <text x="888" y="232" text-anchor="middle" font-size="11" fill="#9c7a1f">all-reduce fwd /</text>
  <text x="888" y="246" text-anchor="middle" font-size="11" fill="#9c7a1f">copy bwd</text>

  <rect x="930" y="150" width="60" height="56" rx="8" fill="#eef3f7" stroke="#8a97a0" stroke-width="2"/>
  <text x="960" y="182" text-anchor="middle" font-size="13" fill="#28323b">Y</text>

  <line x1="150" y1="178" x2="176" y2="178" stroke="#2f7da6" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="222" y1="178" x2="258" y2="160" stroke="#2f7da6" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="480" y1="160" x2="508" y2="172" stroke="#2f7da6" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="610" y1="172" x2="638" y2="160" stroke="#2f7da6" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="840" y1="160" x2="866" y2="178" stroke="#2f7da6" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="910" y1="178" x2="928" y2="178" stroke="#2f7da6" stroke-width="2.5" marker-end="url(#ar)"/>

  <text x="500" y="318" text-anchor="middle" font-size="14" fill="#8a97a0">One all-reduce in the forward (g) and one in the backward (f) per block; the head / intermediate dim stays sharded throughout.</text>
</svg>
