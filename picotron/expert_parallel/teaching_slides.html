<h2 id="ep-the-5th-axis-i-added-to-picotron">EP: the 5th axis I added to picotron</h2>
<p>Stock picotron is <strong><code>DP × PP × CP × TP</code></strong> (4D). I extended its process-group<br />
manager to a 5D grid <strong><code>DP × PP × CP × EP × TP</code></strong> and added the MoE layer that uses it.</p>
<table>
<thead>
<tr>
<th>Tensor</th>
<th>Sharded over</th>
<th>Grad sync</th>
</tr>
</thead>
<tbody>
<tr>
<td>Expert weights <code>FFN_e</code></td>
<td><strong>EP</strong></td>
<td>none (each rank owns distinct experts)</td>
</tr>
<tr>
<td>Router <code>W_g</code>, shared expert, norms</td>
<td>replicated</td>
<td>all-reduce over <code>cp_dp</code></td>
</tr>
</tbody>
</table>
<p>Design constraints I kept:</p>
<ul>
<li><strong>Readable</strong> <code>torch.distributed</code> collectives (picotron spirit)</li>
<li><strong>Bit-exact</strong> across every optimization path (tested vs the naive baseline, <code>grad_diff ≤ 5e-7</code>)</li>
<li>Every knob is <strong>optional</strong> and safe to leave on (auto-fallback)</li>
</ul>
</section>

<h2 id="the-challenge-a-local-op-becomes-a-network-round-trip">The challenge: a local op becomes a network round-trip</h2>
<p>Without EP, the expert FFN is <strong>pure local compute</strong>. EP spreads experts across GPUs,<br />
so every token must be <strong>sent to its expert and sent back</strong> — two all-to-alls<br />
wrapped around the compute.</p>
<p>That round-trip is what makes EP hard:</p>
<ul>
<li><strong>It blocks.</strong> Experts can't start until tokens arrive; the layer can't end until results come back. The GPU sits <strong>idle</strong> during both all-to-alls.</li>
<li><strong>It gets worse at scale.</strong> More GPUs → traffic leaves the fast NVLink island for slower links, while each GPU's share of compute shrinks. Comm starts to dominate.</li>
<li><strong>Backward pays it twice.</strong> The gradient pass repeats both all-to-alls, and plain <code>autograd</code> runs them one-after-another — it won't overlap them for you.</li>
</ul>
<p>→ So we have two levers: make the waiting <strong>invisible</strong> (overlap) or send <strong>less data</strong> (volume).</p>
</section>

<h2 id="the-two-families-of-optimization">The two families of optimization</h2>
<div class="cols">
<div>
<h3 id="1-hide-the-comm-overlap">1. Hide the comm (overlap)</h3>
<p>Run useful compute <em>while</em> the all-to-all is in flight.</p>
<ul>
<li>shared-expert overlap (side stream)</li>
<li>tiled pipeline (fwd <strong>and</strong> bwd)</li>
<li>DeepEP kernels (near-zero SM)</li>
</ul>
<p>→ helps <strong>only</strong> when comm is a real fraction of the step.</p>
</div>
<div>
<h3 id="2-send-fewer-bytes-volume">2. Send fewer bytes (volume)</h3>
<p>Shrink the payload itself.</p>
<ul>
<li>FP8 (E4M3) dispatch</li>
<li>LatentMoE (route/compute in a small latent dim)</li>
</ul>
<p>→ helps even with <strong>nothing left to hide behind</strong>.</p>
</div>
</div>
<br />
<p><strong>Orthogonal.</strong> They stack: <code>latent + fp8</code> cuts bytes 8×, and overlap hides whatever remains.</p>
</section>

<h2 id="step-0--the-naive-baseline">Step 0 — the naive baseline</h2>
<p><code>dispatch → experts → combine</code>, blocking, fully differentiable.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">_moe_naive</span>(<span class="hljs-params">self, tokens, topk_idx, topk_weights</span>):
    routed, expert_idx, w = <span class="hljs-variable language_">self</span>._expand_routed(tokens, topk_idx, topk_weights)
    order, inv, in_list, out_list, local_expert = <span class="hljs-variable language_">self</span>._dest_plan(expert_idx)
    recv          = all_to_all(routed[order], out_list, in_list, group)   <span class="hljs-comment"># dispatch</span>
    recv_out      = <span class="hljs-variable language_">self</span>._run_local_experts(recv, local_expert)           <span class="hljs-comment"># grouped GEMM</span>
    combined      = all_to_all(recv_out, in_list, out_list, group)        <span class="hljs-comment"># combine</span>
    y = <span class="hljs-variable language_">self</span>._combine_topk(combined[inv], w, num_tokens)                  <span class="hljs-comment"># weight + sum top-k</span>
    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>._finalize(y, shared)
</code></pre>
<p>The all-to-all itself is one autograd <code>Function</code> — <strong>backward of an a2a is the reverse a2a</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">_AllToAll</span>(torch.autograd.Function):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">forward</span>(<span class="hljs-params">ctx, group, x, out_splits, in_splits</span>): ...   <span class="hljs-comment"># all_to_all_single(out, x, out, in)</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">backward</span>(<span class="hljs-params">ctx, g</span>):  ...                                <span class="hljs-comment"># all_to_all_single(gin, g, in, out)  ← swapped</span>
</code></pre>
</section>

span></span></span></span></span></span></span></span></span></p>

<h2 id="opt-1--shared-expert-overlap-the-orthogonal-one">Opt 1 — shared-expert overlap (the orthogonal one)</h2>
<p>DeepSeek-style models add an <strong>always-on shared expert</strong> = pure local compute, <strong>no comm</strong>.</p>
<p>Idea: run it on a <strong>side CUDA stream</strong> so it overlaps the routed path's all-to-all.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">_shared_start</span>(<span class="hljs-params">self, tokens</span>):
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> (<span class="hljs-variable language_">self</span>.ep_overlap <span class="hljs-keyword">and</span> <span class="hljs-variable language_">self</span>.ep_world_size &gt; <span class="hljs-number">1</span> <span class="hljs-keyword">and</span> tokens.is_cuda):
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.shared_expert(tokens), <span class="hljs-literal">None</span>          <span class="hljs-comment"># serial (CPU/gloo, 1 rank)</span>
    <span class="hljs-variable language_">self</span>._shared_stream.wait_stream(torch.cuda.current_stream())  <span class="hljs-comment"># tokens ready</span>
    <span class="hljs-keyword">with</span> torch.cuda.stream(<span class="hljs-variable language_">self</span>._shared_stream):
        out = <span class="hljs-variable language_">self</span>.shared_expert(tokens)                 <span class="hljs-comment"># runs concurrently with dispatch/combine</span>
    <span class="hljs-keyword">return</span> out, <span class="hljs-variable language_">self</span>._shared_stream

<span class="hljs-keyword">def</span> <span class="hljs-title function_">_finalize</span>(<span class="hljs-params">self, y, shared</span>):
    out, stream = shared
    <span class="hljs-keyword">if</span> stream <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>:
        torch.cuda.current_stream().wait_stream(stream)  <span class="hljs-comment"># join before the add</span>
    <span class="hljs-keyword">return</span> y + out
</code></pre>
<p><strong>Key design choice:</strong> this is <em>not</em> a 4th path. It composes with <strong>naive / tiled / deepep</strong> alike.</p>
</section>

<h2 id="opt-2--tiled-backward-the-hard-part">Opt 2 — tiled backward (the hard part)</h2>
<blockquote>
<p>MegaScale-MoE's lesson, re-discovered the hard way:<br />
<strong>do not implement the MoE backward with <code>torch.autograd</code>.</strong></p>
</blockquote>
<p>A first version calling <code>torch.autograd.grad</code> twice per tile regressed the full step to <strong>0.87×</strong>.</p>
<p>Why: autograd schedules backward nodes <strong>serially</strong> — you cannot make it interleave one tile's reverse-a2a with another tile's compute. <strong>You must own the backward schedule.</strong></p>
<p>Megatron's independence trick: from the same upstream grad, the FFN backward produces <code>d_input</code> and <code>d_weight</code> <strong>independently</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>per tile:  dgrad → launch reverse-dispatch a2a(d_input)  ∥  compute wgrad
           combine_rev(i+1) is prefetched to cover tile i's recompute
</code></pre>
<p>→ one recompute pass, no double graph traversal, comm hidden behind <code>wgrad</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="gaia" data-style="section {

<h2 id="opt-2--the-triton-megakernel">Opt 2 — the Triton megakernel</h2>
<p>Production-style fused expert FFN (vLLM / MegaBlocks pattern):</p>
<ul>
<li><strong>Grouped GEMM</strong>: fixed <code>BLOCK_M=64</code> token blocks, each block belongs to <strong>one</strong> expert (block-aligned tiling). <code>triton.autotune</code> over tile sizes / warps / stages.</li>
<li>gate &amp; up <strong>fused</strong> into one GEMM <code>w13 = [E, 2I, H]</code> → Triton <code>silu_and_mul</code> → down GEMM.</li>
<li>routed-weight epilogue fused into the down-GEMM store.</li>
</ul>
<p><strong>Explicit backward</strong> (no autograd):</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mtext mathvariant="monospace">dgrad:</mtext><mtext> </mtext></mrow><mi>d</mi><mi>X</mi><mo>=</mo><mi>d</mi><mi>C</mi><mo>⋅</mo><mi>W</mi><mspace width="1em"/><mtext>(reuse fwd GEMM, swap </mtext><mi>W</mi><mtext> strides: </mtext><mi>A</mi><msup><mi>W</mi><mi mathvariant="normal">⊤</mi></msup><mo>→</mo><mi>A</mi><mi>W</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\texttt{dgrad: } dX = dC \cdot W \quad\text{(reuse fwd GEMM, swap } W \text{ strides: } A W^\top \to A W)

rmal">A</span><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="mclose">)</span></span></span></span></span></p><p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mtext mathvariant="monospace">wgrad:</mtext><mtext> </mtext></mrow><mi>d</mi><mi>W</mi><mo>=</mo><msup><mi>C</mi><mi mathvariant="normal">⊤</mi></msup><mi>A</mi><mspace width="1em"/><mtext>(dedicated grouped-GEMM kernel)</mtext></mrow><annotation encoding="application/x-tex">\texttt{wgrad: } dW = C^\top A \quad\text{(dedicated grouped-GEMM kernel)} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9167em;vertical-align:-0.2222em;"></span><span class="mord text"><span class="mord texttt">wgrad: </span></span><span class="mord mathnormal">d</span><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.1491em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8991em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">⊤</span></span></span></span></span></span></span></span><span class="mord mathnormal">A</span><span class="mspace" style="margin-right:1em;"></span><span class="mord text"><span class="mord">(dedicated grouped-GEMM kernel)</span></span></span></span></span></span></p><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">dx_sorted, a_c, di_c = megakernel.fused_moe_dgrad(recv, counts, gate_w, up_w, down_w, d_out)

<h2 id="opt-3--deepep-backend">Opt 3 — DeepEP backend</h2>
<p>Swap our <code>torch.distributed</code> a2a for <strong>DeepEP's hand-written CUDA kernels</strong> (Hopper SM90+).</p>
<ul>
<li>Saturates NVLink/RDMA at <strong>near-zero SM occupancy</strong> → frees SMs for the GEMM (its real win is the cross-node RDMA path, not raw 2-GPU bandwidth).</li>
<li>We wrap the <strong>classic intranode <code>Buffer</code></strong> (NVLink P2P), <em>not</em> the V2 <code>ElasticBuffer</code> — the latter needs NCCL GIN, which aborts on single-node clusters (e.g. Modal H100): <em>&quot;NCCL GIN is unavailable&quot;</em>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">recv_x, handle, recv_idx, recv_w, _ = deepep_backend.dispatch(group, latent, topk_idx, topk_w, E)
expert_out = <span class="hljs-variable language_">self</span>._deepep_experts(recv_x, recv_idx, recv_w)   <span class="hljs-comment"># grouped FFN + gate weights</span>
y = deepep_backend.combine(group, expert_out, handle)         <span class="hljs-comment"># sum per-rank contributions</span>
</code></pre>
<p><code>dispatch</code> and <code>combine</code> are <strong>linear transposes</strong> ⇒ autograd backward of one <strong>is</strong> the other.<br />
Gate weights ride a non-differentiable transport (router grad flows the normal way).</p>
<p><strong>Always safe:</strong> on A100 (sm_80) <code>deepep_available()</code> is False → transparent fallback to torch.</p>
</section>

<h2 id="switching-families--reduce-volume">Switching families — reduce <em>volume</em></h2>
<p>Overlap hides the a2a. But if <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ρ</mi><mo>≪</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\rho \ll 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">ρ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≪</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span>, or you're already hiding everything, the next lever is <strong>fewer bytes on the wire</strong>.</p>
<div class="cols">
<div>
<p><strong>FP8 dispatch</strong><br />
<code>2 B → ~1 B</code> per element.<br />
Comm-bound win.</p>
</div>
<div>
<p><strong>LatentMoE</strong><br />
route/compute in dim <code>l ≪ d</code>.<br />
Cuts comm <strong>and</strong> FLOPs.</p>
</div>
</div>
<p>These are <em>architecture/precision</em> changes to the payload, independent of <em>how</em> it's moved — so they stack with each other <strong>and</strong> with all three overlap paths.</p>
</section>

<h2 id="opt-4--fp8-e4m3-dispatch">Opt 4 — FP8 (E4M3) dispatch</h2>
<p>DeepSeek-V3 recipe: <strong>FP8 dispatch, BF16 combine</strong>.</p>
<p>Per-token scale into E4M3's range (max magnitude <strong>448</strong>):</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>s</mi><mi>t</mi></msub><mo>=</mo><mfrac><mrow><munder><mrow><mi>max</mi><mo>⁡</mo></mrow><mi>h</mi></munder><mi mathvariant="normal">∣</mi><msub><mi>x</mi><mrow><mi>t</mi><mo separator="true">,</mo><mi>h</mi></mrow></msub><mi mathvariant="normal">∣</mi></mrow><mn>448</mn></mfrac><mo separator="true">,</mo><mspace width="2em"/><msub><mover accent="true"><mi>x</mi><mo>^</mo></mover><mi>t</mi></msub><mo>=</mo><mrow><mi mathvariant="normal">c</mi><mi mathvariant="normal">l</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">p</mi></mrow><mtext> ⁣</mtext><mrow><mo fence="true">(</mo><mfrac><msub><mi>x</mi><mi>t</mi></msub><msub><mi>s</mi><mi>t</mi></msub></mfrac><mo separator="true">,</mo><mtext> </mtext><mo>±</mo><mn>448</mn><mo fence="true">)</mo></mrow><mo>∈</mo><mtext mathvariant="monospace">e4m3</mtext></mrow><annotation encoding="application/x-tex">s_t = \frac{\max_h |x_{t,h}|}{448}, \qquad \hat{x}_{t} = \mathrm{clip}\!\left(\frac{x_t}{s_t},\, \pm 448\right) \in \texttt{e4m3}

<h2 id="the-big-lesson">The big lesson</h2>
<div class="cols">
<div>
<h3 id="overlap-3-paths">Overlap (3 paths)</h3>
<p><strong>Bandwidth-bound.</strong> Pays off iff <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ρ</mi><mo>=</mo><msub><mi>t</mi><mtext>comm</mtext></msub><mi mathvariant="normal">/</mi><msub><mi>t</mi><mtext>compute</mtext></msub></mrow><annotation encoding="application/x-tex">\rho = t_\text{comm}/t_\text{compute}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">ρ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">t</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord text mtight"><span class="mord mtight">comm</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord">/</span><span class="mord"><span class="mord mathnormal">t</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord text mtight"><span class="mord mtight">compute</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> is non-trivial:</p>
<ul>
<li>cross-node IB/RoCE <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>large EP degree <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>single-node NVLink <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></li>
</ul>
</div>
<div>
<h3 id="latentmoe">LatentMoE</h3>
<p><strong>Compute-bound win too.</strong> Cuts FLOPs, so it pays off <strong>even on NVLink</strong> (2.14×).<br />
The one lever that doesn't need a comm bottleneck.</p>
<h3 id="fp8-dispatch">FP8 dispatch</h3>
<p>Comm-bound like overlap (+7% off-NVLink, slight regression on NVLink).</p>
</div>
</div>
<br />
<p>Production MoE lives in the <strong>cross-node, large-EP</strong> regime → that's the <code>NCCL_P2P_DISABLE=1</code> row, where everything here compounds.</p>

<h2 id="recap--the-optimization-ladder">Recap — the optimization ladder</h2>
<ol>
<li><strong>Naive</strong> a2a dispatch/combine — differentiable, reverse-a2a backward.</li>
<li><strong>Shared-expert overlap</strong> — side stream, composes with every path.</li>
<li><strong>Tiled pipeline</strong> — fwd ∥; backward needs <strong>explicit kernels</strong> (autograd-twice = 0.87×).</li>
<li><strong>Megakernel</strong> — grouped GEMM; dgrad by stride-swap, dedicated wgrad.</li>
<li><strong>DeepEP</strong> — Hopper kernels, near-zero SM, classic <code>Buffer</code>, auto-fallback.</li>
<li><strong>FP8 dispatch</strong> — E4M3 per-token scale, straight-through BF16 backward, 2× bytes.</li>
<li><strong>LatentMoE</strong> — route/compute in <code>l</code>, cuts comm <strong>and</strong> FLOPs, stacks to 8× with FP8.</li>
</ol>
<p><strong>Throughline:</strong> measure <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding="application/x-tex">\rho</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">ρ</span></span></span></span>. Hide comm where it's expensive; cut bytes/FLOPs where it isn't.</p>
</section>
