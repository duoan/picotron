<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d_ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#c8682f"/>
    </marker>
  </defs>

  <!-- GPU lanes -->
  <rect x="60"  y="40" width="360" height="400" rx="12" fill="#f7f8f9" stroke="#cdd5da" stroke-width="2"/>
  <rect x="580" y="40" width="360" height="400" rx="12" fill="#f7f8f9" stroke="#cdd5da" stroke-width="2"/>
  <text x="240" y="68" text-anchor="middle" font-size="18" fill="#28323b" font-weight="bold">GPU 0 - owns E0, E1</text>
  <text x="760" y="68" text-anchor="middle" font-size="18" fill="#28323b" font-weight="bold">GPU 1 - owns E2, E3</text>

  <!-- stage labels -->
  <g font-size="13" fill="#8a97a0" text-anchor="end">
    <text x="52" y="118">tokens</text>
    <text x="52" y="250">expert FFN</text>
    <text x="52" y="392">output</text>
  </g>

  <!-- tokens row (colored by target expert) -->
  <g font-size="13" fill="#28323b" text-anchor="middle">
    <rect x="90"  y="95" width="64" height="40" rx="6" fill="#d6ebf4" stroke="#2f7da6" stroke-width="2"/><text x="122" y="120">to E1</text>
    <rect x="162" y="95" width="64" height="40" rx="6" fill="#f6e1d2" stroke="#c8682f" stroke-width="2"/><text x="194" y="120">to E3</text>
    <rect x="610" y="95" width="64" height="40" rx="6" fill="#f6e1d2" stroke="#c8682f" stroke-width="2"/><text x="642" y="120">to E0</text>
    <rect x="682" y="95" width="64" height="40" rx="6" fill="#d9efe2" stroke="#4e9e72" stroke-width="2"/><text x="714" y="120">to E2</text>
  </g>

  <!-- dispatch a2a arrows (cross to expert owner) -->
  <text x="500" y="160" text-anchor="middle" font-size="15" fill="#c8682f" font-weight="bold">dispatch (all-to-all)</text>
  <path d="M122,137 L122,200" stroke="#2f7da6" stroke-width="2" marker-end="url(#d_ar)"/>
  <path d="M194,137 C260,180 540,180 640,200" fill="none" stroke="#c8682f" stroke-width="2" marker-end="url(#d_ar)"/>
  <path d="M642,137 C540,180 260,180 150,200" fill="none" stroke="#c8682f" stroke-width="2" marker-end="url(#d_ar)"/>
  <path d="M714,137 L714,200" stroke="#4e9e72" stroke-width="2" marker-end="url(#d_ar)"/>

  <!-- expert boxes -->
  <g font-size="14" fill="#28323b" text-anchor="middle">
    <rect x="95"  y="210" width="80" height="55" rx="8" fill="#d6ebf4" stroke="#2f7da6" stroke-width="2"/><text x="135" y="243">E1</text>
    <rect x="615" y="210" width="80" height="55" rx="8" fill="#eceef0" stroke="#8a97a0" stroke-width="2"/><text x="655" y="243">E0</text>
    <rect x="700" y="210" width="80" height="55" rx="8" fill="#eceef0" stroke="#8a97a0" stroke-width="2"/><text x="740" y="243">E2</text>
    <rect x="305" y="210" width="80" height="55" rx="8" fill="#eceef0" stroke="#8a97a0" stroke-width="2"/><text x="345" y="243">E3</text>
  </g>
  <text x="500" y="238" text-anchor="middle" font-size="12" fill="#8a97a0">grouped GEMM<tspan x="500" dy="16">on received</tspan></text>

  <!-- combine a2a -->
  <text x="500" y="312" text-anchor="middle" font-size="15" fill="#c8682f" font-weight="bold">combine (all-to-all, splits swapped)</text>
  <path d="M135,267 L122,355" stroke="#2f7da6" stroke-width="2" marker-end="url(#d_ar)"/>
  <path d="M345,267 C300,320 230,330 198,355" fill="none" stroke="#c8682f" stroke-width="2" marker-end="url(#d_ar)"/>
  <path d="M655,267 C620,320 700,330 645,355" fill="none" stroke="#c8682f" stroke-width="2" marker-end="url(#d_ar)"/>
  <path d="M740,267 L714,355" stroke="#4e9e72" stroke-width="2" marker-end="url(#d_ar)"/>

  <!-- outputs -->
  <g font-size="13" fill="#28323b" text-anchor="middle">
    <rect x="90"  y="365" width="64" height="40" rx="6" fill="#eceef0" stroke="#28323b" stroke-width="2"/><text x="122" y="390">y0</text>
    <rect x="162" y="365" width="64" height="40" rx="6" fill="#eceef0" stroke="#28323b" stroke-width="2"/><text x="194" y="390">y1</text>
    <rect x="610" y="365" width="64" height="40" rx="6" fill="#eceef0" stroke="#28323b" stroke-width="2"/><text x="642" y="390">y2</text>
    <rect x="682" y="365" width="64" height="40" rx="6" fill="#eceef0" stroke="#28323b" stroke-width="2"/><text x="714" y="390">y3</text>
  </g>
</svg>
