<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="Helvetica, Arial, sans-serif">
  <text x="20" y="34" font-size="16" fill="#28323b" font-weight="bold">Shared-expert overlap: hide comm on a side CUDA stream</text>

  <!-- lane labels -->
  <text x="150" y="95" text-anchor="end" font-size="13" fill="#8a97a0">compute<tspan x="150" dy="15">stream</tspan></text>
  <text x="150" y="185" text-anchor="end" font-size="13" fill="#8a97a0">side<tspan x="150" dy="15">stream</tspan></text>

  <line x1="170" y1="120" x2="900" y2="120" stroke="#eceef0" stroke-width="1"/>
  <line x1="170" y1="210" x2="900" y2="210" stroke="#eceef0" stroke-width="1"/>

  <!-- compute stream: dispatch | experts | combine -->
  <rect x="170" y="78" width="190" height="40" rx="5" fill="#f6e1d2" stroke="#c8682f" stroke-width="2"/>
  <text x="265" y="103" text-anchor="middle" font-size="13" fill="#28323b">dispatch a2a</text>
  <rect x="360" y="78" width="160" height="40" rx="5" fill="#d6ebf4" stroke="#2f7da6" stroke-width="2"/>
  <text x="440" y="103" text-anchor="middle" font-size="13" fill="#28323b">experts</text>
  <rect x="520" y="78" width="190" height="40" rx="5" fill="#f6e1d2" stroke="#c8682f" stroke-width="2"/>
  <text x="615" y="103" text-anchor="middle" font-size="13" fill="#28323b">combine a2a</text>

  <!-- side stream: shared expert overlapping the comm -->
  <rect x="170" y="170" width="330" height="40" rx="5" fill="#d9efe2" stroke="#4e9e72" stroke-width="2"/>
  <text x="335" y="195" text-anchor="middle" font-size="13" fill="#28323b">shared expert (no comm) - runs concurrently</text>

  <!-- join -->
  <line x1="710" y1="60" x2="710" y2="230" stroke="#28323b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="715" y="250" font-size="12" fill="#28323b">wait_stream, then add</text>

  <!-- wall clock -->
  <line x1="170" y1="280" x2="710" y2="280" stroke="#28323b" stroke-width="1.5"/>
  <path d="M710,280 l-8,-4 l0,8 z" fill="#28323b"/>
  <text x="440" y="300" text-anchor="middle" font-size="13" fill="#8a97a0">wall-clock = max(routed path, shared expert) - comm hidden when rho is large</text>
</svg>
