<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#28323b"/>
    </marker>
  </defs>

  <!-- input token -->
  <rect x="20" y="185" width="70" height="60" rx="8" fill="#eceef0" stroke="#28323b" stroke-width="2"/>
  <text x="55" y="212" text-anchor="middle" font-size="22" fill="#28323b" font-style="italic">x</text>
  <text x="55" y="233" text-anchor="middle" font-size="13" fill="#8a97a0">token</text>

  <!-- router -->
  <rect x="140" y="170" width="110" height="90" rx="8" fill="#f6e1d2" stroke="#c8682f" stroke-width="2"/>
  <text x="195" y="205" text-anchor="middle" font-size="18" fill="#28323b">Router</text>
  <text x="195" y="228" text-anchor="middle" font-size="15" fill="#28323b" font-style="italic">Wg x</text>
  <text x="195" y="248" text-anchor="middle" font-size="13" fill="#8a97a0">softmax</text>
  <line x1="90" y1="215" x2="138" y2="215" stroke="#28323b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- prob bars -->
  <g>
    <text x="320" y="120" text-anchor="middle" font-size="13" fill="#8a97a0">g(x)</text>
    <rect x="290" y="170" width="18" height="40" fill="#cdd5da"/>
    <rect x="314" y="150" width="18" height="60" fill="#2f7da6"/>
    <rect x="338" y="185" width="18" height="25" fill="#cdd5da"/>
    <rect x="362" y="140" width="18" height="70" fill="#2f7da6"/>
    <text x="335" y="228" text-anchor="middle" font-size="12" fill="#8a97a0">top-2</text>
  </g>
  <line x1="250" y1="200" x2="286" y2="190" stroke="#28323b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- experts -->
  <g font-size="16" fill="#28323b">
    <rect x="450" y="30"  width="130" height="48" rx="8" fill="#eceef0" stroke="#8a97a0" stroke-width="2"/>
    <text x="515" y="60" text-anchor="middle">FFN 1</text>
    <rect x="450" y="92" width="130" height="48" rx="8" fill="#d6ebf4" stroke="#2f7da6" stroke-width="3"/>
    <text x="515" y="122" text-anchor="middle">FFN 2 (on)</text>
    <rect x="450" y="154" width="130" height="48" rx="8" fill="#eceef0" stroke="#8a97a0" stroke-width="2"/>
    <text x="515" y="184" text-anchor="middle">FFN 3</text>
    <rect x="450" y="216" width="130" height="48" rx="8" fill="#d6ebf4" stroke="#2f7da6" stroke-width="3"/>
    <text x="515" y="246" text-anchor="middle">FFN 4 (on)</text>
  </g>
  <!-- gated routing arrows to selected experts -->
  <path d="M385,180 C420,150 420,120 448,116" fill="none" stroke="#28323b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M385,185 C420,215 420,235 448,240" fill="none" stroke="#28323b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- combine sum -->
  <circle cx="690" cy="178" r="30" fill="#f6e1d2" stroke="#c8682f" stroke-width="2"/>
  <text x="690" y="187" text-anchor="middle" font-size="30" fill="#28323b">+</text>
  <path d="M580,116 C630,130 650,150 665,165" fill="none" stroke="#2f7da6" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M580,240 C630,225 650,205 665,192" fill="none" stroke="#2f7da6" stroke-width="2" marker-end="url(#ar)"/>
  <text x="610" y="120" font-size="13" fill="#8a97a0" font-style="italic">g2</text>
  <text x="610" y="250" font-size="13" fill="#8a97a0" font-style="italic">g4</text>

  <!-- shared expert -->
  <rect x="450" y="320" width="170" height="50" rx="8" fill="#d9efe2" stroke="#4e9e72" stroke-width="2"/>
  <text x="535" y="351" text-anchor="middle" font-size="15" fill="#28323b">Shared expert</text>
  <path d="M88,245 C200,400 360,400 448,360" fill="none" stroke="#4e9e72" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M620,345 C660,330 675,300 688,212" fill="none" stroke="#4e9e72" stroke-width="2" marker-end="url(#ar)"/>

  <!-- output -->
  <rect x="780" y="148" width="70" height="60" rx="8" fill="#eceef0" stroke="#28323b" stroke-width="2"/>
  <text x="815" y="184" text-anchor="middle" font-size="22" fill="#28323b" font-style="italic">y</text>
  <line x1="720" y1="178" x2="778" y2="178" stroke="#28323b" stroke-width="2" marker-end="url(#ar)"/>

  <text x="500" y="412" text-anchor="middle" font-size="14" fill="#8a97a0">y = sum over top-k of  g_e * FFN_e(x)   +   shared(x)</text>
</svg>
