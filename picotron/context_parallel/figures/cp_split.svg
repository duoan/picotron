<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Helvetica, Arial, sans-serif">
  <text x="20" y="30" font-size="18" fill="#28323b" font-weight="bold">Context parallelism: shard the sequence across CP ranks</text>

  <defs>
    <marker id="cp" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2f7da6"/></marker>
  </defs>

  <text x="20" y="80" font-size="13" fill="#8a97a0">full sequence</text>
  <rect x="150" y="62" width="700" height="34" rx="6" fill="#eef3f6" stroke="#9fb2bd" stroke-width="1.5"/>
  <text x="500" y="84" text-anchor="middle" font-size="12" fill="#48606e">tokens 0 .. S-1   [b, S, h]</text>

  <line x1="500" y1="104" x2="500" y2="138" stroke="#2f7da6" stroke-width="2.5" marker-end="url(#cp)"/>
  <text x="560" y="128" font-size="12" fill="#2f7da6">split along sequence (data.py)</text>

  <rect x="150" y="150" width="340" height="40" rx="6" fill="#e8f0fb" stroke="#3b6fb0" stroke-width="2"/>
  <text x="320" y="175" text-anchor="middle" font-size="12" fill="#2b4f80">CP rank 0:  tokens 0 .. S/2-1   [b, S/2, h]</text>
  <rect x="510" y="150" width="340" height="40" rx="6" fill="#fbecea" stroke="#b05a4f" stroke-width="2"/>
  <text x="680" y="175" text-anchor="middle" font-size="12" fill="#7a352e">CP rank 1:  tokens S/2 .. S-1   [b, S/2, h]</text>

  <rect x="150" y="226" width="700" height="50" rx="8" fill="#f7f9fa" stroke="#cdd6db"/>
  <text x="500" y="248" text-anchor="middle" font-size="13" fill="#28323b" font-weight="bold">Every op is per-token EXCEPT attention, which needs all tokens.</text>
  <text x="500" y="267" text-anchor="middle" font-size="12" fill="#8a97a0">RoPE is sliced per shard; only attention must communicate across the CP group.</text>
</svg>
