[project]
name = "picotron"
version = "0.1.0"
description = "Distributed training framework for education and research experimentation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Haojun Zhao" },
    { name = "Ferdinand Mom" },
]
keywords = ["distributed training", "LLM", "pytorch"]
dependencies = [
    "torch==2.1.0",
    "triton==2.1.0",
    "numpy==1.26.4",
    "datasets==2.19.1",
    "transformers==4.47.0",
    "flash-attn==2.5.0",
    "wandb",
    "huggingface_hub[hf_transfer]",
    "jaxtyping>=0.3.7",
]

[project.urls]
Repository = "https://github.com/huggingface/picotron"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["picotron*"]
namespaces = true

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.extra-build-dependencies]
# flash-attn does not declare its build deps; torch/numpy must be present at build time.
flash-attn = [
    "setuptools<82",
    "torch==2.1.0",
    "numpy==1.26.4",
    "ninja",
    "packaging",
    "wheel",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["picotron", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["picotron"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
